<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página no encontrada — AutoFacturación</title>
<link rel="icon" href="/static/img/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0F1B3D;
    --navy:#16265A;
    --navy-mid:#1E3170;
    --blue:#28A9E0;
    --blue-deep:#1C87B8;
    --blue-tint:#E9F5FC;
    --paper:#F4F6F9;
    --paper-2:#FFFFFF;
    --ink:#131C33;
    --muted:#5C6478;
    --line: rgba(19,28,51,0.14);
    --sans: "Manrope", "Roboto", sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    line-height:1.6;-webkit-font-smoothing:antialiased;padding:24px;
  }
  a{color:inherit;}
  img,svg{display:block;max-width:100%;}

  .card{
    max-width:460px;width:100%;background:var(--paper-2);border:1px solid var(--line);
    border-radius:14px;padding:44px 40px;text-align:center;
  }
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;}
  .logo-mark{width:32px;height:32px;flex:none;}
  .logo-text{font-family:var(--sans);font-weight:800;font-size:18px;letter-spacing:-0.01em;color:var(--navy);}

  .codigo{
    font-family:var(--sans);font-weight:800;font-size:56px;letter-spacing:-0.02em;
    color:var(--blue-deep);line-height:1;margin-bottom:10px;
  }
  h1{font-size:20px;font-weight:800;letter-spacing:-0.01em;margin-bottom:12px;}
  p{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:8px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;
    font-family:var(--sans);font-weight:700;font-size:14.5px;
    padding:13px 24px;border-radius:8px;
    text-decoration:none;cursor:pointer;border:1.5px solid transparent;
    background:var(--blue);color:#FFFFFF;
    transition:filter .15s ease, transform .1s ease;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(1px);}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/static/img/logo-icon.png" class="logo-mark" alt="AutoFacturación">
      <div class="logo-text">AutoFacturación</div>
    </div>
    <div class="codigo">404</div>
    <h1>Esta página no existe</h1>
    <p>El link puede estar mal escrito o la página se movió de lugar.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </div>
</body>
</html>
