{% if membresia_dias_restantes is defined and not membresia_vencida %}
{% set dias = membresia_dias_restantes %}
<div style="
  display:inline-flex; align-items:center; gap:6px;
  font-family: 'Manrope', 'Roboto', sans-serif; font-size:12.5px; font-weight:700;
  padding:5px 14px; border-radius:20px; margin-bottom:16px;
  background: {{ '#FBE9E9' if dias <= 3 else ('#FDF1D9' if dias <= 7 else '#E9F5FC') }};
  color: {{ '#D64545' if dias <= 3 else ('#8A5A0A' if dias <= 7 else '#1C87B8') }};
">
  {% if dias <= 0 %}
    Vence hoy
  {% elif dias == 1 %}
    1 día restante
  {% else %}
    {{ dias }} días restantes
  {% endif %}
</div>
{% endif %}
